## AI Game Studios — Aider configuration
##
## Aider reads `.aider.conf.yml` as YAML (NOT markdown). This file's job is to
## tell Aider which project documents to auto-load so the assistant follows the
## same rules as every other AI tool in the studio. The authoritative,
## tool-agnostic project configuration lives in `AGENTS.md`.
##
## Docs: https://aider.chat/docs/config/aider_conf.html

## Auto-load these read-only files into every Aider session so the assistant
## starts with full project context. Aider expands paths relative to the repo
## root.
read:
  - AGENTS.md
  - .claude/docs/coordination-rules.md
  - .claude/docs/coding-standards.md
  - .claude/docs/technical-preferences.md
  - .claude/docs/context-management.md
  - .claude/docs/agent-roster.md

## Behavior nudges that match the studio's collaboration protocol.
## Aider's --yes-always mode is intentionally NOT set — the project requires
## human approval before file writes (see "Collaboration Protocol" in AGENTS.md).
auto-commits: false
dirty-commits: false

## Model selection is left to the user / their environment. The project uses
## capability tiers (Lightweight / Standard / Leader) rather than vendor names.
## Map your preferred model to the tier in AGENTS.md → "Model Routing".
